# Render Blueprint — API + optional static frontend (see comments).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zweckos-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    # Set these in the Render dashboard (or link to Neon / secrets):
    # DATABASE_URL — Neon connection string (?sslmode=require)
    # JWT_SECRET — strong random string
    # ALLOWED_ORIGINS — https://your-app.vercel.app
    # Optional: ALLOW_VERCEL_PREVIEWS=true for preview deployments

  # Static frontend — build from repo root (leave Root Directory empty in dashboard).
  # Do NOT add prisma migrate here (schema is under server/ only).
  - type: web
    name: zweckos-client
    runtime: static
    buildCommand: npm install && sh render-build.sh
    staticPublishPath: ./client/dist
