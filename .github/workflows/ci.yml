name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zweckos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d zweckos_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: prisma migrate deploy (fresh DB)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zweckos_ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/zweckos_ci?schema=public
        run: cd server && npx prisma migrate deploy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install Playwright (Chromium)
        run: cd client && npx playwright install chromium --with-deps
      - run: npm run test:e2e
